name: Daily SBI TT Rates Update

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-sbi-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch SBI rates PDF
        run: bash run.sh

      - name: Show archived file
        if: always()
        run: |
          TZ=Asia/Kolkata
          DATE=$(TZ=$TZ date '+%Y-%m-%d')
          YEAR=$(TZ=$TZ date '+%Y')
          MONTH=$(TZ=$TZ date '+%m')
          FILE="sbi-rates/$YEAR/$MONTH/$DATE.pdf"

          if [ -f "$FILE" ]; then
            echo "PDF saved: $FILE"
          else
            echo "No PDF saved for $DATE."
          fi

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ TaxBro SBI Rates Updated"
          to: www.sahilwadhwa520@gmail.com
          from: TaxBro Bot
          body: |
            SBI rates workflow completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run ID: ${{ github.run_id }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ TaxBro SBI Rates Update Failed"
          to: www.sahilwadhwa520@gmail.com
          from: TaxBro Bot
          body: |
            SBI rates workflow FAILED.

            Repository: ${{ github.repository }}
            Run ID: ${{ github.run_id }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
